<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find houses and shops for rent in Chennai. Veedu Vadagaiku - Chennai's most trusted rental marketplace." />
    <meta name="keywords" content="house for rent Chennai, shop for rent Chennai, rental property Chennai, வீடு வாடகைக்கு" />
    <meta property="og:title" content="Veedu Vadagaiku - Chennai Rental Marketplace" />
    <meta property="og:description" content="Find your perfect home or shop for rent in Chennai. Browse verified listings across all Chennai localities." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B2545" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <title>Veedu Vadagaiku - Chennai Rental Marketplace</title>
  </head>
  <body>
    <!-- Instant Preloader: White background with centered logo only -->
    <div id="preloader" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;background-color:#ffffff;display:flex;align-items:center;justify-content:center;transition:opacity 0.45s ease,visibility 0.45s ease;">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;">
        <img
          src="/logo-full.png"
          alt="Veedu Vadagaiku"
          style="width:260px;max-width:78vw;height:auto;object-fit:contain;animation:preloaderPulse 1.8s ease-in-out infinite;"
        />
      </div>
    </div>
    <style>
      @keyframes preloaderPulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.65;
          transform: scale(0.97);
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
